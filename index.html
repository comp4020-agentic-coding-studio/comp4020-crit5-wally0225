<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pillars</title>
    <meta
      name="description"
      content="A tiny survival game: read the warning, get behind a wall, live."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Pillars</a>
      </nav>
      <div class="round-status">
        <p id="round" aria-live="polite"></p>
        <p id="round-timer" aria-live="polite"></p>
      </div>
    </header>
    <main>
      <h1 class="visually-hidden">Pillars</h1>
      <div id="start-screen" class="cover-state">
        <p class="cover-title">Pillars</p>
        <button id="start-button" type="button">Start</button>
      </div>
      <div id="arena" hidden>
        <div class="arrow-row arrow-up" data-direction="up">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="middle-row">
          <div class="arrow-col arrow-left" data-direction="left">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div id="board"></div>
          <div class="arrow-col arrow-right" data-direction="right">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="arrow-row arrow-down" data-direction="down">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div id="game-over" class="end-state" hidden>
        <p id="rounds-survived"></p>
        <button id="restart" type="button">Restart</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
